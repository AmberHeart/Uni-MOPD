[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unimopd"
version = "0.1.0"
description = "Merge-first multi-teacher on-policy distillation for multimodal specialists"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Wenzheng Chang"},
  {name = "Taiqiang Wu"},
  {name = "Yuqi Xu"},
  {name = "Yongfu Zhu"},
  {name = "Zelin Peng"},
  {name = "Ji Zhao"},
  {name = "Shuai Dong"},
  {name = "Wenpu Liu"},
  {name = "Caoyuan Ma"},
  {name = "Xuehui Wang"},
  {name = "Ziyue Wang"},
  {name = "Weichu Xie"},
  {name = "Ngai Wong"},
  {name = "Tong He"},
  {name = "Wenqi Shao"},
  {name = "Jiaqi Wang"},
]
keywords = ["model-merging", "knowledge-distillation", "multimodal", "mixture-of-experts"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy",
  "omegaconf>=2.3.0",
  "PyYAML>=5.4",
  "safetensors",
  "torch>=2.4",
  "transformers>=4.57,<4.58",
]

[project.urls]
Repository = "https://github.com/AmberHeart/Uni-MOPD"

[tool.setuptools.packages.find]
include = ["unimopd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
