# Paper configuration for the released step-50 Uni-MOPD checkpoint.
rlhf_type: gkd
train_type: full
model: ${oc.env:STUDENT_MODEL}
teacher_models:
  - ${oc.env:TEACHER_STEM}
  - ${oc.env:TEACHER_VQA}
  - ${oc.env:TEACHER_DOCUMENT}
  - ${oc.env:TEACHER_GUI}
  - ${oc.env:TEACHER_EMBODIED}
domain_teacher_mapping:
  StemPuzzle: 0
  GeneralVQA: 1
  TextChartUnder: 2
  guiagent: 3
  EmbodUnde: 4
dataset:
  - ${oc.env:DATA_PATH}
save: ${oc.env:OUTPUT_DIR}

split_dataset_ratio: 0
dataset_shuffle: false
train_dataloader_shuffle: false
num_workers: 0
seed: 42
data_seed: 42
strict: true
check_model: false
add_version: false
truncation_strategy: delete
mopd_resample_retries: 3
mopd_resample_backoff_base_s: 0.5
mopd_resample_retry_budget_s: 60

seq_kd: false
lmbda: 1
gkd_loss_type: jsd
beta: 1
gkd_loss_temperature: 1
calculate_per_token_loss: true
mopd_loss_normalization: global_token
mopd_response_only_logits: true
mopd_head_chunk_size: 0

max_length: 20480
max_completion_length: 12288
mopd_max_sequence_length: 32768
seq_length: 32768
mopd_domain_generation_config:
  StemPuzzle:
    max_tokens: 12288
    temperature: 1
    max_prompt_tokens: 20480
  GeneralVQA:
    max_tokens: 8192
    temperature: 1
    max_prompt_tokens: 20480
  TextChartUnder:
    max_tokens: 12288
    temperature: 1
    max_prompt_tokens: 20480
  guiagent:
    max_tokens: 1024
    temperature: 1
    max_prompt_tokens: 20480
  EmbodUnde:
    max_tokens: 4096
    temperature: 1
    max_prompt_tokens: 20480

temperature: 1
top_p: 1
top_k: -1
repetition_penalty: 1
enable_thinking: false
use_vllm: true
vllm_mode: server
vllm_server_host:
  - ${oc.env:ROLLOUT_HOST}
vllm_server_port:
  - ${oc.env:ROLLOUT_PORT,8000}
vllm_server_group_port:
  - ${oc.env:ROLLOUT_GROUP_PORT,20000}
vllm_server_timeout: 1800
sleep_level: 0

mopd_router_replay: r3
mopd_train_flash_attention_version: "2"
mopd_parallel_weight_sync: true
mopd_rollout_completion_chunk_size: 128
mopd_rollout_queue_max_bytes: 8589934592
mopd_rollout_samples_per_step: 0
mopd_teacher_rpc_timeout: 1800
mopd_teacher_cpu_cache: true
offload_teacher_model: true
lazy_teacher_logits: true

torch_dtype: bfloat16
attention_backend: flash
padding_free: true
sequence_parallel: true
freeze_vit: false
freeze_aligner: false
finetune: true

micro_batch_size: 1
global_batch_size: 512
tensor_model_parallel_size: 2
expert_model_parallel_size: 8
expert_tensor_parallel_size: 1
pipeline_model_parallel_size: 1
context_parallel_size: 1

train_iters: 50
save_interval: 10
mopd_prune_old_optimizer_states: true
log_interval: 1
lr: 3e-6
lr_decay_style: constant
lr_warmup_fraction: 0
min_lr: 3e-6
weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.99
adam_eps: 1e-5
clip_grad: 1

recompute_granularity: full
recompute_method: uniform
recompute_num_layers: 1
deterministic_mode: true
moe_router_load_balancing_type: aux_loss
moe_aux_loss_coeff: 0
moe_router_enable_expert_bias: false
ckpt_format: torch_dist
skip_metric_dp_allreduce: true
megatron_extra_kwargs:
  rerun_mode: disabled
