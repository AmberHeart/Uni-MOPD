# Hand-tuned comparison reported in the paper.
method: dare
base: "${BASE_MODEL}"
inputs:
  - "${TEACHER_STEM}"
  - "${TEACHER_VQA}"
  - "${TEACHER_DOCUMENT}"
  - "${TEACHER_GUI}"
  - "${TEACHER_EMBODIED}"
weights: [0.1, 0.15, 0.35, 0.3, 0.1]
drop_rates: [0.7, 0.7, 0.7, 0.7, 0.7]
seed: 42
workers: 4
output_dir: "${OUTPUT_DIR}"
